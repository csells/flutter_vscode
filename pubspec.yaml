name: flutter_vscode
description: >-
  Build VS Code extensions with Dart-owned host behavior and optional Flutter
  views.
version: 0.1.0
homepage: https://github.com/SlowGen/flutter_vscode

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  analyzer: ^10.0.1
  archive: ^4.0.9
  build: ^4.0.3
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  meta: ^1.9.1
  path: ^1.8.3
  source_gen: ^4.1.1
  web: ^1.1.0
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.10.4
  build_test: ^3.5.4
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  very_good_analysis: ^10.0.0

executables:
  flutter_vscode: flutter_vscode
  generate_vscode_extension: generate_vscode_extension
